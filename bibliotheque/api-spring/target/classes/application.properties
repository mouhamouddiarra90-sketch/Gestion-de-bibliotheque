# Connexion MariaDB / MySQL (XAMPP : root sans mot de passe par défaut)
# Modifiables sans toucher au fichier : variables d'environnement DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/bibliotheque}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# La base existe deja : Hibernate ne doit rien creer ni modifier
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Messages d'erreur lisibles dans les reponses JSON
server.error.include-message=always
server.error.include-binding-errors=always
server.address=0.0.0.0

