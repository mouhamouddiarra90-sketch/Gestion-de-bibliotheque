<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4f46e5">
    <title>Bibliothèque</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="#/">
                <span class="brand-logo" id="brand-logo"></span>
                <span>Bibliothèque</span>
            </a>
            <nav id="nav" class="nav" aria-label="Navigation principale">
                <a href="#/" data-route="/" data-icone="tableau"><span>Tableau de bord</span></a>
                <a href="#/livres" data-route="/livres" data-icone="livre"><span>Livres</span></a>
                <a href="#/adherents" data-route="/adherents" data-icone="adherents"><span>Adhérents</span></a>
                <a href="#/emprunts" data-route="/emprunts" data-icone="emprunts"><span>Emprunts &amp; retours</span></a>
            </nav>
        </div>
    </header>

    <main id="app" class="container"></main>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <!-- Formulaire générique (ajout / modification d'un livre ou d'un adhérent) -->
    <dialog id="dialog-form" aria-labelledby="form-titre">
        <form id="form-generique">
            <h2 id="form-titre"></h2>
            <div id="form-champs"></div>
            <p id="form-erreur" class="form-error" role="alert" hidden></p>
            <div class="dialog-actions">
                <button type="button" class="btn" id="form-annuler">Annuler</button>
                <button type="submit" class="btn primary">Enregistrer</button>
            </div>
        </form>
    </dialog>

    <!-- Confirmation de suppression -->
    <dialog id="dialog-confirm" aria-labelledby="confirm-titre">
        <form method="dialog">
            <h2 id="confirm-titre">Confirmation</h2>
            <p id="confirm-message"></p>
            <div class="dialog-actions">
                <button value="cancel" class="btn">Annuler</button>
                <button value="ok" class="btn danger" id="confirm-ok">Supprimer</button>
            </div>
        </form>
    </dialog>

    <script src="js/app.js"></script>
</body>
</html>
